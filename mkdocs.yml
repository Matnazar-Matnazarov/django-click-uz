site_name: django-click-uz
site_description: Django integration for the Click.uz payment gateway
site_url: https://django-click-uz.readthedocs.io/
repo_url: https://github.com/Matnazar-Matnazarov/click-uz-sdk
repo_name: Matnazar-Matnazarov/click-uz-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Contributing & release: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Matnazar-Matnazarov/click-uz-sdk
